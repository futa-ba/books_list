<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>図書一覧</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header class="page-header">

<h1>
📚 図書一覧
</h1>

<p>
読みたい本を探して貸出申請できます
</p>

</header>

<div class="back-area">

<a href="index.html" class="back-button">

🏠 ホームへ戻る

</a>

</div>



<main>


<section class="search-area">


<input
id="keyword"
type="text"
placeholder="タイトル・著者・分類で検索">


</section>




<section 
id="bookList"
class="book-list">


<table id="bookTable">

<thead>

<tr>

<th>ID</th>
<th>タイトル</th>
<th>著者</th>
<th>分類</th>
<th>状態</th>
<th>貸出</th>

</tr>

</thead>


<tbody>

<tr>

<td colspan="6">

📚 本を読み込み中です...

</td>

</tr>


</tbody>

</table>

</section>


</main>




<footer>

<p>
© yamauchi
</p>

</footer>



<script src="js/books.js"></script>


</body>

</html>
